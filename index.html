.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ===== GATE (landing) ===== */
#gate{position:fixed; inset:0; z-index:50; display:grid; place-items:center; overflow:hidden; background:var(--green-slide); color:#fff; transition:opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease)}
#gate.away{opacity:0; transform:scale(1.04); filter:blur(8px); pointer-events:none}
.gate-bg{position:absolute; inset:-6%; background:var(--cover-green) center/cover no-repeat; animation:drift 38s ease-in-out infinite alternate; will-change:transform}
@keyframes drift{from{transform:scale(1) translate3d(0,0,0)} to{transform:scale(1.1) translate3d(-1.5%,1%,0)}}
.gate-veil{position:absolute; inset:0; background:
  radial-gradient(ellipse 62% 58% at 50% 48%, rgba(37,82,51,.55) 0%, rgba(37,82,51,.25) 50%, rgba(16,40,26,.55) 100%),
  linear-gradient(180deg, rgba(16,40,26,.35), rgba(16,40,26,0) 35%, rgba(16,40,26,.45))}
.gate-line{position:absolute; left:50%; top:0; width:1px; height:0; background:linear-gradient(180deg, transparent, var(--gold)); animation:line 1.6s var(--ease) .2s forwards}
@keyframes line{to{height:18vh}}
.gate-inner{position:relative; text-align:center; padding:0 24px; max-width:820px; width:100%}
.gate-mark{width:46px; height:46px; margin:0 auto 28px; border:1px solid rgba(255,255,255,.55); border-radius:50%; display:grid; place-items:center; color:#fff; opacity:0; animation:rise 1s var(--ease) .5s forwards}
.gate-mark svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.gate-title{font-family:var(--serif); font-weight:600; color:#fff; font-size:clamp(2.4rem, 6.4vw, 5rem); line-height:1.08; letter-spacing:-.01em; opacity:0; animation:rise 1s var(--ease) .7s forwards; text-shadow:0 2px 30px rgba(0,0,0,.18)}
.gate-sub{margin-top:20px; color:var(--sage); font-size:clamp(.78rem, 1.4vw, .95rem); letter-spacing:.28em; text-transform:uppercase; opacity:0; animation:rise 1s var(--ease) .95s forwards}
.gate-form{margin:46px auto 0; max-width:420px; opacity:0; animation:rise 1s var(--ease) 1.2s forwards}
.field{position:relative; display:flex; align-items:center; border-bottom:1px solid rgba(255,255,255,.4); transition:border-color .3s}
.field:focus-within{border-color:rgba(255,255,255,.8)}
.field::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--gold); transform:scaleX(0); transform-origin:left; transition:transform .5s var(--ease)}
.field:focus-within::after{transform:scaleX(1)}
.field input{flex:1; min-width:0; background:transparent; border:0; outline:0; padding:14px 8px 14px 4px; color:#fff; font-size:1.05rem; letter-spacing:.12em; text-align:center; caret-color:var(--gold)}
.field input::placeholder{color:rgba(255,255,255,.5); letter-spacing:.24em; text-transform:uppercase; font-size:.78rem}
.field input:-webkit-autofill{-webkit-text-fill-color:#fff; -webkit-box-shadow:0 0 0 1000px var(--green-slide) inset; transition:background-color 9999s}
.field button{width:42px; height:42px; border:0; border-radius:50%; background:#fff; color:var(--green-slide); cursor:pointer; display:grid; place-items:center; transition:transform .3s var(--ease), background .3s, color .3s; flex:none}
.field button:hover{transform:translateX(3px); background:var(--gold); color:#fff}
.field button svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.gate-msg{min-height:22px; margin-top:14px; font-size:.82rem; letter-spacing:.04em; color:#F0C9A0; opacity:0; transition:opacity .3s}
.gate-msg.show{opacity:1}
.field.shake{animation:shake .5s var(--ease)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.gate-form.busy button{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@keyframes rise{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}

/* ===== DECK CHROME ===== */
#deck{opacity:0; transition:opacity 1s var(--ease)}
#deck.on{opacity:1}
.topbar{position:fixed; top:0; left:0; right:0; z-index:40; height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(16px, 3vw, 40px); background:rgba(255,255,255,.82); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid rgba(33,87,50,.12); transform:translateY(-100%); transition:transform .6s var(--ease)}
.topbar.show{transform:none}
.topbar .logo{width:84px}
.topbar .mid{font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); font-weight:600}
.topbar .right{display:flex; align-items:center; gap:14px; font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--grey-mid)}
.topbar .lock{width:32px; height:32px; border-radius:50%; border:1px solid rgba(33,87,50,.3); background:transparent; color:var(--green); cursor:pointer; display:grid; place-items:center; transition:background .3s, color .3s}
.topbar .lock:hover{background:var(--green); color:#fff}
.topbar .lock svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.progress{position:fixed; top:0; left:0; height:3px; width:100%; z-index:41; transform-origin:left; transform:scaleX(0); background:linear-gradient(90deg, var(--green), var(--gold))}
.dots{position:fixed; right:22px; top:50%; transform:translateY(-50%); z-index:40; display:flex; flex-direction:column; gap:14px}
.dots a{width:8px; height:8px; border-radius:50%; background:rgba(33,87,50,.25); transition:transform .3s var(--ease), background .3s; position:relative}
.dots a.active{background:var(--green); transform:scale(1.5)}
.dots a::after{content:attr(data-label); position:absolute; right:18px; top:50%; transform:translateY(-50%); white-space:nowrap; font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--green); opacity:0; transition:opacity .3s; pointer-events:none}
.dots a:hover::after{opacity:1}
body.on-dark .dots a{background:rgba(255,255,255,.35)}
body.on-dark .dots a.active{background:#fff}
body.on-dark .dots a::after{color:#fff}

/* ===== SLIDES ===== */
.slide{position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:96px 0 72px; border-bottom:1px solid rgba(33,87,50,.08)}
.slide:nth-child(even){background:linear-gradient(180deg, #FFFFFF, #FAFCF9)}
.wrap{width:min(1180px, calc(100% - 48px)); margin:0 auto}
.wrap.wide{width:min(1320px, calc(100% - 48px))}
.slide-foot{position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; padding:0 clamp(20px,3vw,44px) 18px; font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:#9AA3AD}
.slide-head{margin-bottom:38px}
.slide-head.sub-head{margin-top:60px}
.service{display:block; font-size:.68rem; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:22px}
.slide-head h2{font-family:var(--serif); font-weight:600; color:var(--green); font-size:clamp(1.55rem, 3vw, 2.35rem); line-height:1.15; letter-spacing:-.005em; display:flex; align-items:flex-start; gap:14px}
.chev{flex:none; width:12px; height:12px; margin-top:.55em; border-right:2px solid var(--green); border-top:2px solid var(--green); transform:rotate(45deg); display:inline-block}
.lead{margin-top:14px; font-weight:600; font-size:1.02rem; color:var(--ink); max-width:74ch}
.lead.light{font-weight:400; color:var(--ink-soft); max-width:none}
.tiny-title{font-size:.7rem; letter-spacing:.22em; text-transform:uppercase; color:var(--green); font-weight:700; margin-bottom:18px}
.tiny-title.dark{color:var(--ink)}
.tiny-title.mt{margin-top:42px}

/* reveal */
.reveal{opacity:0; transform:translateY(26px); transition:opacity .9s var(--ease), transform .9s var(--ease)}
.reveal.d1{transition-delay:.12s}.reveal.d2{transition-delay:.24s}.reveal.d3{transition-delay:.36s}.reveal.d4{transition-delay:.5s}
.in .reveal, .reveal.in{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none; transition:none}.gate-bg{animation:none}}

/* ===== 01 cover ===== */
.cover{padding:0; justify-content:center; min-height:100vh; min-height:100svh}
.cover-bg{position:absolute; inset:0; background-position:center; background-size:cover; background-repeat:no-repeat}
.cover-veil{position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,255,255,.94) 0%, rgba(255,255,255,.8) 45%, rgba(255,255,255,.25) 100%)}
.cover-wrap{position:relative; padding:120px 0 100px}
.logo svg{width:100%; height:auto}
.cover .logo{width:min(250px, 52vw); margin-bottom:54px}
.kicker{font-size:.74rem; letter-spacing:.28em; text-transform:uppercase; color:var(--green); font-weight:700; margin-bottom:18px}
.cover h1{font-family:var(--serif); font-weight:600; color:var(--green); font-size:clamp(2.3rem, 5.4vw, 4.6rem); line-height:1.06; letter-spacing:-.012em; max-width:14ch}
.cover .sub{margin-top:22px; font-size:clamp(1rem, 1.6vw, 1.2rem); color:var(--ink-soft); max-width:46ch}
.cover .tagline{margin-top:68px; font-family:var(--serif); font-size:clamp(1rem, 1.5vw, 1.18rem); color:var(--green-2); max-width:56ch}
.scroll-cue{position:absolute; left:50%; bottom:28px; transform:translateX(-50%); width:26px; height:42px; border:1.5px solid rgba(33,87,50,.5); border-radius:14px}
.scroll-cue span{position:absolute; left:50%; top:8px; width:3px; height:8px; margin-left:-1.5px; border-radius:2px; background:var(--green); animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{opacity:0; transform:translateY(0)} 30%{opacity:1} 100%{opacity:0; transform:translateY(14px)}}

/* ===== 02 large asset ===== */
.grid-2-1{display:grid; grid-template-columns:minmax(0, 1.55fr) minmax(0, 1fr); gap:44px; align-items:center}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:52px; align-items:start}
.flow{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:center; gap:10px}
.flow-card{background:var(--grey-light); padding:26px 22px 22px; min-height:172px; display:flex; flex-direction:column; justify-content:center; border-radius:4px; transition:transform .5s var(--ease), box-shadow .5s var(--ease)}
.flow-card:hover{transform:translateY(-4px); box-shadow:0 18px 40px -22px rgba(23,63,39,.45)}
.flow-card .lbl{font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; font-weight:700; color:var(--ink-soft)}
.flow-card .big{display:block; font-family:var(--serif); font-size:clamp(1.7rem, 2.6vw, 2.35rem); line-height:1.1; color:var(--ink); margin:8px 0 10px; font-weight:700; white-space:nowrap}
.flow-card .cap{font-size:.78rem; color:var(--grey-mid); margin-top:auto}
.flow-card .x{font-family:var(--sans); font-weight:500; font-size:.8em; vertical-align:.08em}
.flow-card.fill{background:var(--green-deep); color:#fff}
.flow-card.fill .big{color:#fff; margin-top:0}
.flow-card.fill .lbl{color:rgba(255,255,255,.85); text-transform:none; letter-spacing:.02em; font-size:.82rem; font-weight:500}
.flow-card.fill .cap{color:rgba(255,255,255,.6)}
.arrow{font-family:var(--serif); color:var(--gold); font-size:2rem; line-height:1; font-weight:700; text-align:center}
.note h4{font-size:.9rem; color:var(--ink); margin-bottom:10px}
.note p{font-size:.9rem; color:var(--ink-soft); line-height:1.65}
.note p + p{margin-top:12px}
.note strong{color:var(--ink)}

/* vertical bars */
.vbars{display:grid; grid-template-columns:repeat(3, 1fr); gap:24px; align-items:end; height:190px; padding-bottom:26px; position:relative; border-bottom:1px solid rgba(31,41,55,.15)}
.vbars.tall{height:250px}
.vbars.nolabels{padding-bottom:0}
.vbar{position:relative; height:100%; display:flex; align-items:flex-end}
.vbar-fill{width:100%; height:var(--h); max-height:100%; transform:scaleY(0); transform-origin:bottom; transition:transform 1.1s var(--ease) .2s; position:relative; border-radius:3px 3px 0 0}
.in .vbar-fill{transform:scaleY(1)}
.vbar-fill.grey{background:var(--grey)}.vbar-fill.sage{background:var(--sage)}.vbar-fill.green{background:var(--green)}
.vbar-fill span{position:absolute; left:0; right:0; top:-26px; text-align:center; font-size:.78rem; font-weight:700; color:var(--ink); opacity:0; transition:opacity .6s ease 1s}
.in .vbar-fill span{opacity:1}
.vbar label{position:absolute; left:0; right:0; bottom:-26px; text-align:center; font-size:.76rem; color:var(--ink-soft); letter-spacing:.04em}

.stake-rows li{display:flex; justify-content:space-between; align-items:center; gap:16px; background:var(--grey-light); padding:14px 18px; border-radius:4px; transition:background .3s}
.stake-rows li:hover{background:var(--green-mist)}
.stake-rows li + li{margin-top:10px}
.stake-rows strong{display:block; font-size:.92rem; color:var(--ink)}
.stake-rows span{display:block; font-size:.76rem; color:var(--ink-soft)}
.stake-rows .val{text-align:right}
.stake-rows .val strong, .stake-rows .val span{color:var(--green)}

/* ===== 03 steps ===== */
.steps{display:grid; grid-template-columns:repeat(5, 1fr); gap:22px; position:relative; margin-top:6px}
.steps::before{content:""; position:absolute; left:calc(10% - 2px); right:calc(10% - 2px); top:24px; height:2px; background:linear-gradient(90deg, var(--green) 0%, var(--green) 78%, var(--sage) 100%); transform:scaleX(0); transform-origin:left; transition:transform 1.4s var(--ease) .2s}
.in .steps::before{transform:scaleX(1)}
.steps li{text-align:center; position:relative}
.steps .num{width:50px; height:50px; border-radius:50%; background:var(--green); color:#fff; font-weight:700; display:grid; place-items:center; margin:0 auto 22px; font-size:.95rem; box-shadow:0 0 0 6px #fff; position:relative; transition:transform .5s var(--ease)}
.steps li:hover .num{transform:scale(1.1)}
.steps .last .num{background:var(--sage); color:var(--ink)}
.steps h4{font-size:.95rem; color:var(--ink); margin-bottom:10px; line-height:1.3}
.steps p{font-size:.84rem; color:var(--ink-soft); line-height:1.6}

.trio{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:12px; align-items:stretch}
.trio-card{background:var(--grey-light); padding:30px 28px; border-radius:4px; position:relative; transition:transform .5s var(--ease), box-shadow .5s var(--ease)}
.trio-card:hover{transform:translateY(-4px); box-shadow:0 18px 40px -22px rgba(23,63,39,.45)}
.trio-card .idx{font-family:var(--serif); font-size:2.2rem; color:var(--gold); line-height:1; display:block; margin-bottom:14px; font-weight:700}
.trio-card h4{font-size:.98rem; color:var(--ink); margin-bottom:12px; line-height:1.35}
.trio-card p{font-size:.86rem; color:var(--ink-soft); line-height:1.65}
.trio-card.fill{background:var(--green-deep); color:#fff}
.trio-card.fill h4{color:#fff}
.trio-card.fill p{color:rgba(255,255,255,.82)}

/* ===== 04 why now ===== */
.why{align-items:start}
.stat{font-family:var(--serif); font-weight:700; color:var(--green); font-size:clamp(2.6rem, 5vw, 4rem); line-height:1; display:flex; align-items:center; gap:18px}
.stat .to{font-family:var(--sans); font-weight:300; color:var(--gold); font-size:.6em}
.stat-note{margin-top:14px; font-size:.86rem; color:var(--ink-soft); line-height:1.6}
.points li{padding:0 0 26px 0; margin-bottom:26px; border-bottom:1px solid rgba(31,41,55,.1)}
.points li:last-child{border:0; margin:0; padding:0}
.points h4{font-family:var(--serif); font-size:1.18rem; color:var(--green); display:flex; gap:12px; align-items:flex-start; margin-bottom:8px; line-height:1.3}
.points .chev{width:10px; height:10px; margin-top:.5em}
.points p{font-size:.88rem; color:var(--ink-soft); line-height:1.65; padding-left:22px}
.source{margin-top:48px; font-size:.7rem; color:#9AA3AD; letter-spacing:.02em}

/* ===== 05 ownership ===== */
.phases{display:grid; grid-template-columns:repeat(5, 1fr); gap:16px; position:relative}
.phases::before{content:""; position:absolute; left:10%; right:10%; top:46px; height:2px; background:var(--grey); z-index:0}
.phase{display:flex; flex-direction:column; position:relative}
.phase .when{font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; text-align:center; margin-bottom:12px}
.phase .num{width:34px; height:34px; border-radius:50%; background:var(--green); color:#fff; font-weight:700; font-size:.82rem; display:grid; place-items:center; margin:0 auto 16px; box-shadow:0 0 0 6px #fff; position:relative; z-index:1}
.phase h4{font-family:var(--serif); text-align:center; color:var(--green); font-size:1.1rem; line-height:1.25; margin-bottom:14px; min-height:2.5em}
.phase .card{background:var(--green-soft); padding:18px 16px 16px; border-radius:4px; flex:1; display:flex; flex-direction:column; transition:transform .5s var(--ease), box-shadow .5s var(--ease)}
.phase .card:hover{transform:translateY(-3px); box-shadow:0 20px 40px -24px rgba(23,63,39,.5)}
.phase .card p{font-size:.78rem; line-height:1.55; color:var(--ink)}
.phase .card p + p{margin-top:8px}
.phase .card hr{border:0; border-top:1px solid rgba(33,87,50,.35); margin:14px 0 12px}
.phase .card .pps{margin-top:auto; padding-top:14px; font-weight:700; color:var(--navy); font-size:.8rem}
.hbar{display:flex; height:22px; margin:14px 0 12px; background:#fff; border:1px solid rgba(31,41,55,.25); overflow:hidden}
.hbar i{display:block; height:100%; width:var(--w); flex:none; transform:scaleX(0); transform-origin:left; transition:transform 1s var(--ease) .3s}
.in .hbar i{transform:scaleX(1)}
.hbar i + i{border-left:1px solid #fff}
.hbar .green, .legend .green, .price-row .green{background:var(--green)}
.hbar .grey, .legend .grey, .price-row .grey{background:var(--grey)}
.hbar .sage, .legend .sage{background:var(--sage)}
.hbar .dark, .legend .dark{background:var(--grey-mid)}
.hbar .white, .legend .white{background:#fff}
.legend li{display:flex; align-items:flex-start; gap:8px; font-size:.76rem; line-height:1.4; color:var(--ink); margin-bottom:6px}
.legend li span{flex:1; min-width:0}
.legend li i{flex:none; width:12px; height:12px; margin-top:3px; border:1px solid rgba(31,41,55,.35)}
.legend b{margin-right:4px}
.ticks{display:flex; justify-content:space-between; font-size:.66rem; color:var(--ink-soft); margin:-8px 0 10px}
.band{margin-top:34px; background:var(--green-deep); color:#fff; display:grid; grid-template-columns:auto 1fr auto 1fr; align-items:center; gap:30px; padding:22px 36px; border-radius:4px}
.band-title{font-weight:700; font-size:1.05rem}
.band-item{display:flex; align-items:center; gap:16px}
.band-item strong{font-family:var(--serif); font-size:clamp(2rem, 3.2vw, 2.8rem); line-height:1; font-weight:700}
.band-item span{font-size:.82rem; line-height:1.45; color:rgba(255,255,255,.85)}
.band-item span b{color:#fff}
.band .vs{font-size:.9rem; color:rgba(255,255,255,.7); font-style:italic; font-family:var(--serif)}

/* ===== 06 offering ===== */
.offer{display:grid; grid-template-columns:minmax(0, 4fr) minmax(0, 7fr); gap:24px; align-items:stretch}
.offer > *, .grid-2 > *, .grid-2-1 > *, .phases > *, .table-scroll{min-width:0}
.offer-left{background:var(--green-soft); padding:36px 32px; border-radius:4px}
.huge{display:block; font-family:var(--serif); font-weight:700; font-size:clamp(3.2rem, 6vw, 5rem); line-height:1; color:var(--green)}
.buys{font-weight:700; font-size:1.02rem; color:var(--ink); margin:14px 0 26px; line-height:1.35}
.price-row{display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:.86rem}
.price-row i{display:block; height:26px; width:var(--w); max-width:60%; flex:none; color:#fff; font-style:normal; font-size:.78rem; display:flex; align-items:center; padding:0 10px; transform:scaleX(0); transform-origin:left; transition:transform 1s var(--ease) .3s; overflow:hidden; white-space:nowrap}
.in .price-row i{transform:scaleX(1)}
.price-row .grey{width:calc(60% * 0.167); min-width:44px}
.price-row b{font-size:1.02rem; color:var(--ink)}
.price-row span{color:var(--ink-soft)}
.terms{margin-top:26px}
.terms li{display:flex; gap:12px; align-items:flex-start; font-size:.9rem; line-height:1.45; margin-bottom:12px; color:var(--ink-soft)}
.terms b{color:var(--ink); margin-right:4px}
.terms svg{flex:none; width:22px; height:22px; stroke:var(--green); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--green); margin-top:1px}
.offer-right{background:var(--grey-light); padding:36px 32px; border-radius:4px; display:flex; flex-direction:column; justify-content:center}
.offer-right h3{font-family:var(--serif); color:var(--green); font-size:clamp(1.15rem, 1.8vw, 1.45rem); line-height:1.3; margin-bottom:12px}
.offer-right > p{font-size:.88rem; color:var(--ink-soft); line-height:1.6; margin-bottom:26px}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.returns{width:100%; border-collapse:separate; border-spacing:3px; font-size:.9rem; min-width:520px}
.returns th, .returns td{padding:13px 6px; text-align:center; white-space:nowrap}
.returns thead th:first-child, .returns tbody th{white-space:normal; padding-left:10px}
.returns thead th{background:var(--green); color:#fff; font-weight:700}
.returns thead th:first-child, .returns tbody th{text-align:left}
.returns tbody th{font-weight:600; color:var(--ink); background:#fff}
.returns tbody td{background:#fff; font-weight:700; color:var(--ink)}
.returns tbody tr:last-child th{font-weight:400}
.returns td.loss{color:#8A2E1F}

/* ===== 07 closing ===== */
.closing{background:var(--green-slide); color:#fff; border:0; text-align:center; padding:96px 0}
.closing-wrap{display:flex; flex-direction:column; align-items:center}
.closing .logo{width:min(320px, 62vw); margin-bottom:64px}
.closing-line{font-weight:700; font-size:clamp(1rem, 1.6vw, 1.15rem)}
.closing-mail{display:inline-block; margin-top:12px; color:rgba(255,255,255,.8); text-decoration:none; font-size:.95rem; border-bottom:1px solid rgba(255,255,255,.35); padding-bottom:2px; transition:color .3s, border-color .3s}
.closing-mail:hover{color:#fff; border-color:var(--gold)}

/* ===== Responsive ===== */
@media (max-width:1100px){
  .phases{grid-template-columns:repeat(3, 1fr); gap:20px 16px}
  .phases::before{display:none}
  .phase .num{margin-bottom:12px}
  .band{grid-template-columns:1fr; gap:18px; padding:26px 28px}
  .band .vs{display:none}
}
@media (max-width:900px){
  .grid-2-1, .grid-2{grid-template-columns:1fr; gap:36px}
  .steps{grid-template-columns:1fr; gap:26px; padding-left:70px}
  .steps::before{left:24px; right:auto; top:6px; bottom:6px; width:2px; height:auto; background:linear-gradient(180deg, var(--green) 0%, var(--green) 78%, var(--sage) 100%); transform:scaleY(0); transform-origin:top}
  .in .steps::before{transform:scaleY(1)}
  .steps li{text-align:left}
  .steps .num{position:absolute; left:-70px; top:-2px; margin:0}
  .trio{grid-template-columns:1fr}
  .trio .arrow{transform:rotate(90deg); margin:-2px 0}
  .offer{grid-template-columns:1fr}
  .dots{display:none}
  .topbar .mid{display:none}
}
@media (max-width:640px){
  .slide{padding:84px 0 64px}
  .wrap, .wrap.wide{width:calc(100% - 32px)}
  .flow{grid-template-columns:1fr}
  .flow .arrow{transform:rotate(90deg); margin:-4px 0}
  .flow-card{min-height:0; padding:22px 20px}
  .flow-card .big{white-space:normal}
  .phases{grid-template-columns:1fr}
  .phase h4{min-height:0}
  .slide-head.sub-head{margin-top:44px}
  .slide-foot{font-size:.6rem; padding:0 16px 14px}
  .slide-foot span:nth-child(2){display:none}
  .topbar{height:52px}
  .topbar .logo{width:70px}
  .cover-veil{background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.86) 60%, rgba(255,255,255,.6) 100%)}
  .cover .tagline{margin-top:44px}
  .band-item{align-items:flex-start}
  .stat{gap:12px}
  .field input{font-size:1rem}
  .returns{font-size:.8rem; min-width:520px; border-spacing:2px}
  .returns th, .returns td{padding:10px 7px}
  .returns thead th:first-child, .returns tbody th{position:sticky; left:0; z-index:1}
  .returns tbody th{background:#fff; box-shadow:4px 0 8px -6px rgba(0,0,0,.25)}
  .returns thead th:first-child{background:var(--green)}
  .table-scroll::before{content:"Swipe sideways to see all share prices"; display:block; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-mid); margin-bottom:8px}
}

</style>

  const SALT = "jmae7+mFFce2n2y948yVvg==";
  const IV = "UmKcd9U5O2OfS+nJ";
  const ITER = 300000;
  const LABELS = ["Cover","Large asset","ListCo owner","Why now","Ownership","Offering","Contact"];

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const gate = document.getElementById('gate'), form = document.getElementById('gate-form'),
        pw = document.getElementById('pw'), msg = document.getElementById('gate-msg'),
        deck = document.getElementById('deck'), topbar = document.getElementById('topbar'),
        dots = document.getElementById('dots'), progress = document.getElementById('progress');

  const subtle = (window.crypto && crypto.subtle) ? crypto.subtle : null;

  async function keyFrom(pass){
    const km = await subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  async function open(key){
    const buf = await subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(PAYLOAD));
    return new TextDecoder().decode(buf);
  }

  function show(html){
    deck.innerHTML = html;
    const l = deck.querySelector('.logo-dark'); if (l) document.getElementById('toplogo').innerHTML = l.innerHTML;
    document.body.classList.add('unlocked');
    gate.classList.add('away');
    setTimeout(() => { gate.remove(); }, 1000);
    deck.classList.add('on');
    topbar.classList.add('show');
    build();
  }

  function build(){
    const slides = [...deck.querySelectorAll('.slide')];
    dots.innerHTML = slides.map((s,i) => `<a href="#${s.id}" data-label="${LABELS[i]||''}" aria-label="${LABELS[i]||('Section '+(i+1))}"></a>`).join('');
    const dotEls = [...dots.children];
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) e.target.classList.add('in');
    }), {threshold:0.18});
    slides.forEach(s => io.observe(s));
    const active = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) {
        const i = slides.indexOf(e.target);
        dotEls.forEach((d,j) => d.classList.toggle('active', j===i));
        document.body.classList.toggle('on-dark', e.target.classList.contains('closing'));
      }
    }), {threshold:0.5});
    slides.forEach(s => active.observe(s));
    const onScroll = () => {
      const h = document.documentElement;
      const p = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
      progress.style.transform = `scaleX(${Math.min(1, Math.max(0, p))})`;
    };
    addEventListener('scroll', onScroll, {passive:true}); onScroll();
    requestAnimationFrame(() => { slides[0] && slides[0].classList.add('in'); });
  }

  async function tryUnlock(pass){
    if (!subtle) { msg.textContent = 'Please open this page over https.'; msg.classList.add('show'); return; }
    form.classList.add('busy');
    try {
      const key = await keyFrom(pass.trim().toLowerCase());
      const html = await open(key);
      try { sessionStorage.setItem('dspac_k', btoa(String.fromCharCode(...new Uint8Array(await subtle.exportKey('raw', key))))); } catch(e){}
      show(html);
    } catch(e) {
      const f = form.querySelector('.field'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      msg.textContent = 'That is not it. Try again.'; msg.classList.add('show');
      pw.select();
    } finally { form.classList.remove('busy'); }
  }

  if (form) {
    form.addEventListener('submit', e => { e.preventDefault(); if (pw.value) tryUnlock(pw.value); else pw.focus(); });
    pw.addEventListener('input', () => msg.classList.remove('show'));
  } else { build(); }

  document.getElementById('lock').addEventListener('click', () => { try { sessionStorage.removeItem('dspac_k'); } catch(e){} location.reload(); });

  (async () => {
    try {
      const raw = sessionStorage.getItem('dspac_k');
      if (raw && subtle) {
        const key = await subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, true, ['decrypt']);
        const html = await open(key);
        gate.style.transition = 'none'; show(html); return;
      }
    } catch(e) { try { sessionStorage.removeItem('dspac_k'); } catch(_){} }
    if (pw) setTimeout(() => pw.focus({preventScroll:true}), 1500);
  })();
})();
</script>
